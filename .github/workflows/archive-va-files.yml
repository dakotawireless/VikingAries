name: Archive VA durable files

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/archive-va-files.yml"

permissions:
  contents: read

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - name: Check out VA file vault
        uses: actions/checkout@v4
        with:
          ref: va-files

      - name: Collect Dakota Wireless POS files
        run: |
          set -euo pipefail
          test -d project-files/dw-pos
          mkdir -p /tmp/dw-pos-files
          cp -a project-files/dw-pos/. /tmp/dw-pos-files/

      - name: Upload private migration handoff
        uses: actions/upload-artifact@v4
        with:
          name: dw-pos-va-files-handoff
          path: /tmp/dw-pos-files
          retention-days: 1
          if-no-files-found: error
